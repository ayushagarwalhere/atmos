AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Atmos Build It local evidence manifest function (no cloud deployment required)
Resources:
  EvidenceManifest:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: manifest/
      Handler: handler.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ATMOS_AWS_ENDPOINT: http://host.docker.internal:5000
