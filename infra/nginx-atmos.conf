server {
    listen 80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/atmos-acme;
    }
    location / {
        return 308 https://13.49.222.44$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 13.49.222.44;
    ssl_certificate /etc/letsencrypt/live/atmos-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atmos-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 25m;
    }
}
