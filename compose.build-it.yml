services:
  aws-emulator:
    image: ghcr.io/getmoto/motoserver:5.1.22
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MOTO_PORT: "5000"
  opensearch:
    image: opensearchproject/opensearch:3.3.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - atmos-search:/usr/share/opensearch/data
volumes:
  atmos-search:
